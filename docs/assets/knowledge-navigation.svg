<g id="student" transform="translate(78 114)"><circle r="31" fill="#205f68"/><text x="0" y="7" class="white" text-anchor="middle">Mₜ</text><text x="0" y="51" class="small" text-anchor="middle">Student</text></g>
<g id="prefix-0" transform="translate(225 114)"><circle r="22" class="node good"/><path d="M-7 0l5 5 10-11" class="check"/></g><g id="prefix-1" transform="translate(351 114)"><circle r="22" class="node good"/><path d="M-7 0l5 5 10-11" class="check"/></g>
<text x="288" y="71" class="good-label" text-anchor="middle">Supported prefix</text>
<g id="failed-branch" opacity=".16"><path id="wrong-path" d="M374 114H782" class="route draw-red" fill="none"/><g id="wrong-0" transform="translate(517 114)"><circle r="22" class="node bad"/><path d="M-6-6L6 6M6-6L-6 6" class="cross"/></g><g id="wrong-1" transform="translate(649 114)"><circle r="22" class="node bad"/><path d="M-6-6L6 6M6-6L-6 6" class="cross"/></g><g id="wrong-2" transform="translate(782 114)"><circle r="22" class="node bad"/><path d="M-6-6L6 6M6-6L-6 6" class="cross"/></g><text x="650" y="72" class="bad-label" text-anchor="middle">First error → failed suffix</text></g>


<path id="safe-boundary" d="M421 90v108" class="boundary"/>

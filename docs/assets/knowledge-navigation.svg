<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 430" role="img" aria-labelledby="scene-title scene-description" data-mobile="false">
<title id="scene-title">Knowledge Navigation in MedEvo</title>
<desc id="scene-description">A schematic. Supported reasoning is preserved while the first erroneous operation is rolled back. A gold-blind auditor supplies an answer-free hint and the same student regenerates the suffix. A screened repair replaces a training target in the evolving dataset. Each round trains from the same base model M zero. Independent feedback identifies remaining gaps and redirects the next training questions.</desc>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#fbfcfa;color:#213e43}text{font-size:14px;fill:#34585e}text.small{font-size:11px;fill:#708387}text.label{font-size:10px;letter-spacing:1.8px;fill:#648084;font-weight:650}text.good-label{fill:#176d76;font-size:12px}text.bad-label{fill:#9b615a;font-size:12px}text.white{fill:white;font-size:20px;font-weight:600}text.base{font-size:13px;fill:#44676d}text.title{font-weight:650;fill:#24484e}text.violet{fill:#735788;font-size:12px}.route{stroke:#dce6e3;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.draw-blue{stroke:#247d85;stroke-width:3}.draw-red{stroke:#c18276;stroke-width:2.5}.draw-violet{stroke:#85689a;stroke-width:3}.rollback{stroke:#b58579;stroke-width:1.8;stroke-dasharray:5 6}.node{stroke-width:1.8;fill:#fcfdfa}.node.good{stroke:#78a9a8;fill:#edf5f1}.node.bad{stroke:#c59d90;fill:#f8f0eb}.node.repaired{stroke:#247d85;fill:#e6f3ec}.check{fill:none;stroke:#297c75;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.cross{stroke:#b4776d;stroke-width:1.9;stroke-linecap:round}.plain{fill:#fff;stroke:#cad9d4;stroke-width:1.5}.paper-line{stroke:#b5cac6;stroke-width:2;stroke-linecap:round}.violet-line{stroke:#957cac;stroke-width:2;stroke-linecap:round}.ghost{fill:#edf1eb;stroke:#d3ded7;stroke-width:1.2}.active-target{fill:#e1f0e8;stroke:#5f9b87;stroke-width:1.4}.hint-shape{fill:#fff9e9;stroke:#c5b786;stroke-width:1.3}.sft{fill:#edf5f1;stroke:#95b2a9;stroke-width:1.5}.feedback-shape{fill:#f4eef7;stroke:#c4b5ce;stroke-width:1.4}.small-arrow{fill:none;stroke:#729994;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.ring{fill:none;stroke:#b88072;stroke-width:1.5;stroke-dasharray:4 5}.marker-blue{fill:#247d85}.marker-violet{fill:#85689a}.boundary{stroke:#89aaa3;stroke-width:1;stroke-dasharray:3 5}
</style>

<text x="26" y="25" class="label" text-anchor="start">LOCAL REPAIR</text>
<text x="26" y="412" class="label" text-anchor="start">DATA EVOLUTION</text>
<g id="outer-track">
<path id="target-track" d="M875 189C992 189 1004 323 951 323" class="route " fill="none"/><path id="data-track" d="M854 323H674" class="route " fill="none"/><path id="model-track" d="M602 323H444" class="route " fill="none"/><path id="selection-track" d="M372 323H227" class="route " fill="none"/><path id="return-track" d="M110 323H78V148" class="route " fill="none"/>
</g>
<g id="trace-core">

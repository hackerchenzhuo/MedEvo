<g id="hint" transform="translate(495 247)"><rect x="-75" y="-18" width="150" height="36" rx="18" class="hint-shape"/><text x="0" y="5" class="base" text-anchor="middle">Answer-free hint</text><text x="0" y="35" class="small" text-anchor="middle">Gold-blind auditor</text></g>
<path id="hint-path" d="M496 230C452 223 421 188 421 134" class="route draw-blue" fill="none"/>
</g>
<g id="dataset" transform="translate(902 323)">
<rect x="-38" y="-30" width="78" height="50" rx="5" class="ghost"/><rect x="-43" y="-24" width="82" height="51" rx="5" class="plain"/>
<g id="old-target" opacity="0"><rect x="-49" y="-16" width="91" height="47" rx="5" class="plain"/><path d="M-33-2H25M-33 7H17M-33 16H25" class="paper-line"/></g>

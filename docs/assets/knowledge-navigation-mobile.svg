</g>
<g id="evaluation" transform="translate(98 344)"><circle r="29" class="feedback-shape"/><path d="M-14 4l9-11 8 15 12-14" class="violet-line" fill="none"/><text x="0" y="-43" class="title" text-anchor="middle">Evaluate</text></g>
<g id="feedback" transform="translate(97 420)"><rect x="-75" y="-17" width="150" height="34" rx="5" class="feedback-shape"/><text x="0" y="5" class="violet" text-anchor="middle">Held-out feedback</text></g>

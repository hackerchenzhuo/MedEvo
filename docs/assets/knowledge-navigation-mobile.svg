<g id="student" transform="translate(45 88)"><circle r="31" fill="#205f68"/><text x="0" y="7" class="white" text-anchor="middle">Mₜ</text><text x="0" y="51" class="small" text-anchor="middle">Student</text></g>
<g id="prefix-0" transform="translate(149 88)"><circle r="22" class="node good"/><path d="M-7 0l5 5 10-11" class="check"/></g><g id="prefix-1" transform="translate(258 88)"><circle r="22" class="node good"/><path d="M-7 0l5 5 10-11" class="check"/></g>
<text x="205" y="48" class="good-label" text-anchor="middle">Supported prefix</text>
<g id="failed-branch" opacity=".16"><path id="wrong-path" d="M280 88H473" class="route draw-red" fill="none"/><g id="wrong-0" transform="translate(375 88)"><circle r="22" class="node bad"/><path d="M-6-6L6 6M6-6L-6 6" class="cross"/></g><g id="wrong-1" transform="translate(473 88)"><circle r="22" class="node bad"/><path d="M-6-6L6 6M6-6L-6 6" class="cross"/></g><text x="426" y="47" class="bad-label" text-anchor="middle">First error → failed suffix</text></g>


<path id="safe-boundary" d="M310 64v105" class="boundary"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 590" class="navigation-scene" role="img" aria-labelledby="scene-title scene-description" data-mobile="true">
<title id="scene-title">Knowledge Navigation in MedEvo</title>
<desc id="scene-description">A schematic. Supported reasoning is preserved while the first erroneous operation is rolled back. A gold-blind auditor supplies an answer-free hint and the same student regenerates the suffix. A screened repair replaces a training target in the evolving dataset. Each round trains from the same base model M zero. Independent feedback identifies remaining gaps and redirects the next training questions.</desc>
<style>
.navigation-scene{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#fff;color:#203e51}
.navigation-scene text{font-size:22px;fill:#294b62}
.navigation-scene text.small{font-size:20px;fill:#4b6373}
.navigation-scene text.label{font-size:18px;letter-spacing:1.2px;fill:#3f6075;font-weight:650}
.navigation-scene text.good-label{fill:#246c91;font-size:20px}
.navigation-scene #prefix-caption text{fill:#74519a}
.navigation-scene text.bad-label{fill:#9a4e49;font-size:20px}
.navigation-scene text.white{fill:white;font-size:23px;font-weight:600}
.navigation-scene text.base{font-size:20px;fill:#294b62}
.navigation-scene text.title{font-weight:650;fill:#24485d}
.navigation-scene text.violet{fill:#725093;font-size:20px}
.navigation-scene .route{stroke:#c1d3df;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.navigation-scene .draw-blue{stroke:#287db1;stroke-width:2.7}.navigation-scene #prefix-path{stroke:#7a52a1}
.navigation-scene .draw-red{stroke:#ba746d;stroke-width:2.5}.navigation-scene .draw-violet{stroke:#7a52a1;stroke-width:2.7}
.navigation-scene .rollback{stroke:#af7069;stroke-width:2;stroke-dasharray:5 6}
.navigation-scene .node{stroke-width:1.8;fill:#fff}.navigation-scene .node.good{stroke:#9c83b5;fill:#f3eef8}
.navigation-scene .node.bad{stroke:#c89991;fill:#fbf0ec}.navigation-scene .node.repaired{stroke:#278c9e;fill:#eaf6f8}
.navigation-scene .check{fill:none;stroke:#267b8c;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.navigation-scene .node.good+.check{stroke:#7a52a1}
.navigation-scene .cross{stroke:#ae665f;stroke-width:1.9;stroke-linecap:round}
.navigation-scene .plain{fill:#fff;stroke:#bdcedb;stroke-width:1.5}.navigation-scene .paper-line{stroke:#83a7bb;stroke-width:2;stroke-linecap:round}
.navigation-scene .violet-line{stroke:#987bb0;stroke-width:2;stroke-linecap:round}
.navigation-scene .ghost{fill:#f0f5f9;stroke:#ccdbe4;stroke-width:1.2}.navigation-scene .active-target{fill:#eaf6f0;stroke:#70a18c;stroke-width:1.4}
.navigation-scene .hint-shape{fill:#f5f0fa;stroke:#aa90be;stroke-width:1.3}.navigation-scene .sft{fill:#edf6fb;stroke:#91b5cc;stroke-width:1.5}
.navigation-scene .feedback-shape{fill:#f3edf8;stroke:#b09cc2;stroke-width:1.4}.navigation-scene .ring{fill:none;stroke:#b8776c;stroke-width:1.5;stroke-dasharray:4 5}
.navigation-scene .marker-blue{fill:#287db1}.navigation-scene .marker-violet{fill:#7a52a1}.navigation-scene .boundary{stroke:#8babc0;stroke-width:1.3;stroke-dasharray:3 5}
</style>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#287db1" stroke-width="1.7"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#7a52a1" stroke-width="1.7"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#af7069" stroke-width="1.7"/></marker></defs>
<text x="23" y="23" class="label" text-anchor="start">LOCAL REPAIR</text>
<text x="310" y="553" class="label" text-anchor="start">DATA EVOLUTION</text>
<g id="outer-track">
<path id="target-track" d="M498 164C534 194 523 343 487 344" class="route " fill="none"/><path id="data-track" d="M390 344H300" class="route " fill="none"/><path id="model-track" d="M228 344H135" class="route " fill="none"/><path id="selection-track" d="M98 375C98 463 210 458 210 479" class="route " fill="none"/><path id="return-track" d="M124 503H10V88H14" class="route " fill="none"/>
</g>
<g id="trace-core">
<path id="prefix-path" d="M77 88H258" class="route draw-blue" fill="none"/>
<g id="student" transform="translate(45 88)"><circle r="31" fill="#287db1"/><text x="0" y="7" class="white" text-anchor="middle">Mₜ</text><text x="8" y="51" class="small" text-anchor="middle">Student</text></g>
<g id="prefix-0" transform="translate(149 88)"><circle r="22" class="node good"/><path d="M-7 0l5 5 10-11" class="check"/></g><g id="prefix-1" transform="translate(258 88)"><circle r="22" class="node good"/><path d="M-7 0l5 5 10-11" class="check"/></g>
<g id="prefix-caption"><text x="205" y="48" class="good-label" text-anchor="middle">Supported prefix</text></g>
<g id="failed-branch" opacity=".16"><path id="wrong-path" d="M280 88H473" class="route draw-red" fill="none"/><g id="wrong-0" transform="translate(375 88)"><circle r="22" class="node bad"/><path d="M-6-6L6 6M6-6L-6 6" class="cross"/></g><g id="wrong-1" transform="translate(473 88)"><circle r="22" class="node bad"/><path d="M-6-6L6 6M6-6L-6 6" class="cross"/></g></g><g id="failed-label"><text x="426" y="47" class="bad-label" text-anchor="middle">First error</text></g>


<path id="safe-boundary" d="M310 64v105" class="boundary"/>
<g id="new-branch"><path id="correct-path" d="M280 88C332 88 332 164 349 164H476" class="route draw-blue" fill="none"/><g id="corrected-0" transform="translate(373 164)"><circle r="22" class="node repaired"/><path d="M-7 0l5 5 10-11" class="check"/></g><g id="corrected-1" transform="translate(476 164)"><circle r="22" class="node repaired"/><path d="M-7 0l5 5 10-11" class="check"/></g></g><g id="new-branch-labels"><text x="372" y="212" class="good-label" text-anchor="middle">New suffix</text><text x="476" y="212" class="small" text-anchor="middle">Screened</text></g>
<g id="hint" transform="translate(413 246)"><rect x="-90" y="-18" width="180" height="36" rx="5" class="hint-shape"/><text x="0" y="5" class="base" text-anchor="middle">Answer-free hint</text><text x="0" y="35" class="small" text-anchor="middle">Gold-blind auditor</text></g>
<path id="hint-path" d="M323 229C289 229 292 174 310 111" class="route draw-blue" fill="none" data-arrow="arrow-blue" marker-end="url(#arrow-blue)"/>
</g>
<g id="dataset" transform="translate(438 344)">
<rect x="-38" y="-30" width="78" height="50" rx="5" class="ghost"/><rect x="-43" y="-24" width="82" height="51" rx="5" class="plain"/>
<g id="old-target" opacity="0"><rect x="-49" y="-16" width="91" height="47" rx="5" class="plain"/><path d="M-33-2H25M-33 7H17M-33 16H25" class="paper-line"/></g>
<g id="new-target"><rect x="-49" y="-16" width="91" height="47" rx="5" class="active-target"/><path d="M-33-2H6M-33 7H0M-33 16H6" class="paper-line"/><g transform="translate(24 7)"><path d="M-7 0l5 5 10-11" class="check"/></g></g>
<text x="0" y="55" class="title" text-anchor="middle">Evolving dataset</text><text x="0" y="72" class="small" text-anchor="middle">Replace one target</text>
</g>
<path id="target-path" d="M498 164C534 194 523 343 487 344" class="route draw-blue" fill="none" data-arrow="arrow-blue" marker-end="url(#arrow-blue)"/><path id="data-path" d="M390 344H300" class="route draw-blue" fill="none" data-arrow="arrow-blue" marker-end="url(#arrow-blue)"/>
<g id="training">
<g transform="translate(264 344)"><circle r="34" class="sft"/><text x="0" y="6" class="title" text-anchor="middle">SFT</text></g>
<g id="base-model" transform="translate(240 269)"><rect x="-75" y="-17" width="150" height="34" rx="5" class="plain"/><text x="0" y="5" class="base" text-anchor="middle">Same base M₀</text></g>
<path id="base-path" d="M240 288C240 304 264 296 264 308" class="route draw-blue" fill="none" data-arrow="arrow-blue" marker-end="url(#arrow-blue)"/><path id="model-path" d="M228 344H135" class="route draw-blue" fill="none" data-arrow="arrow-blue" marker-end="url(#arrow-blue)"/><text x="182" y="323" class="base" text-anchor="middle">Mₜ₊₁</text>
</g>
<g id="evaluation" transform="translate(98 344)"><circle r="29" class="feedback-shape"/><path d="M-14 4l9-11 8 15 12-14" class="violet-line" fill="none"/><text x="0" y="-49" class="title" text-anchor="middle">Evaluate</text></g>
<g id="feedback" transform="translate(115 420)"><rect x="-90" y="-17" width="180" height="34" rx="5" class="feedback-shape"/><text x="0" y="5" class="violet" text-anchor="middle">Held-out feedback</text></g>
<path id="feedback-path" d="M115 403C115 384 98 386 98 373" class="route draw-violet" fill="none" data-arrow="arrow-violet" marker-end="url(#arrow-violet)"/><path id="selection-path" d="M98 375C98 463 210 458 210 479" class="route draw-violet" fill="none" data-arrow="arrow-violet" marker-end="url(#arrow-violet)"/>
<g id="selection" transform="translate(180 503)">
<rect x="-50" y="-29" width="89" height="51" rx="5" class="ghost" transform="rotate(-9)"/><rect x="-42" y="-22" width="87" height="50" rx="5" class="plain" transform="rotate(6)"/>
<g id="selected-question"><rect x="-47" y="-24" width="94" height="52" rx="5" class="feedback-shape"/><rect x="-33" y="-10" width="17" height="17" rx="3" fill="#c4d8d0"/><path d="M-8-7H31M-8 1H22M-32 17H31" class="paper-line"/><path d="M30-15l5 5 9-10" class="violet-line" fill="none"/></g>
<text x="0" y="54" class="title" text-anchor="middle">Next questions</text><text x="0" y="72" class="small" text-anchor="middle">Medical tags + errors</text>
</g>
<path id="return-path" d="M124 503H10V88H14" class="route draw-violet" fill="none" data-arrow="arrow-violet" marker-end="url(#arrow-violet)"/>





</svg>